server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lq-deepseek-bff
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/lq_deepseek?stringtype=unspecified
    username: lq
    password: ${LQ_DB_PASSWORD:lq_deepseek_pwd}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: LqDeepseekHikariPool

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.lq.deepseek.domain.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: lq-token
  timeout: 604800
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

lq:
  agent:
    base-url: http://127.0.0.1:8000
    connect-timeout: 3000ms
    read-timeout: 60000ms
  gateway:
    single-flight:
      owner-lease-ms: 30000
      heartbeat-interval-ms: 5000
      max-wait-ms: 120000
      max-followers: 200
      replay-ttl-ms: 300000
      local-fallback-enabled: true
    retry:
      max-attempts: 3
      backoff-ms: 300
  storage:
    type: local
    # 简历 / JD 原件落盘目录（相对 BFF 运行目录），换对象存储时只改这里
    local-root: ./data/files

logging:
  level:
    root: info
    com.lq.deepseek: debug
