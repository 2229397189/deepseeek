# Chiron 同源部署配置（放到 /etc/nginx/sites-available/chiron，再软链到 sites-enabled）
#
# 为什么必须同源：前端 apiClient/sseClient 用 `import.meta.env.VITE_API_BASE ?? ''`，
# 即 API 基址为空 = 请求当前页面同一端口下的 /api。
# 如果 web 与 BFF 分处不同端口，/api 会打到静态服务器被回退成 index.html，拿不到 JSON。
#
# 端口说明：
#   listen 3100            —— 对外唯一入口（避开已占用 80/8080）
#   proxy_pass ...:8180    —— BFF（避开 ai-interview 占用的 8080）
#
# ⚠️ 两个易错点（写错就白部署）：
#   1) proxy_pass 末尾【不带 /】：保留 /api 前缀，因为 BFF 的 context-path=/api。
#      若写成 http://127.0.0.1:8180/ ，/api/xxx 会被剥成 /xxx，后端全部 404。
#   2) proxy_buffering off：SSE 端点 POST /api/agent/stream 是流式响应，
#      开启缓冲后前端收不到增量 step 事件，表现为「一直转圈不出结果」。

server {
    listen 3100;
    server_name _;

    root /opt/chiron/web/dist;
    index index.html;

    # 对齐 spring.servlet.multipart.max-request-size: 50MB（简历/JD 上传）
    client_max_body_size 50m;

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8180;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 需要 Connection 头能透传（HTTP/1.1 + 空 Connection）
        proxy_set_header Connection        "";

        # —— SSE 流式必需 ——
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # agent 流水线 max-wait-ms=120000，默认 60s 会在流中途掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 静态资源长缓存（dist 文件名带 hash）
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    access_log /var/log/nginx/chiron-access.log;
    error_log  /var/log/nginx/chiron-error.log warn;
}
